# Framework Defaults - DO NOT MODIFY PER PROJECT
# Override in projects/{project}/config.properties

AUTHOR = Injas Mahendra Berutu

# Browser defaults
BROWSER = chrome
HEADLESS = false

# Wait timeouts
EXPLICIT_WAIT_TIMEOUT = 10
HARD_WAIT_TIMEOUT = 2
STEP_TIME = 1
PAGE_LOAD_TIMEOUT = 60
API_TIMEOUT = 20

# Screenshot/Video paths
SCREENSHOT_PATH = ./exports/ExportData/Images/
RECORD_VIDEO_PATH = ./exports/ExportData/Videos/
RECORD_VIDEO = no
SCREENSHOT_STEP_ALL = no

# Report paths
EXTENT_REPORT_PATH = exports/ExtentReport/ExtentReport.html
EXTENT_REPORT_ZIP_PATH = exports/ExtentReport.zip
REPORT_TITLE = Automation Test Execution Report - {env} - {suite}
OVERRIDE_REPORTS = no

# Report features
REPORT.ALLURE.ENABLED = true
REPORT.EXTENT.ENABLED = true
REPORT.EMAIL.ENABLED = false

# Email defaults
EMAIL.SMTP.HOST = smtp.gmail.com
EMAIL.SMTP.PORT = 587
EMAIL.FROM =
EMAIL.PASSWORD =
EMAIL.TO =

# Localization
LOCATE = en

# Test retry
RETRY_TEST_FAIL = 0
